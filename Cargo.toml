[workspace]
resolver = "3"
members = ["crates/hermir", "crates/hermir-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unom-io/hermir"
readme = "README.md"
rust-version = "1.96"

[workspace.dependencies]
hermir = { path = "crates/hermir", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
