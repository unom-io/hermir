[package]
name = "hermir-cli"
description = "hermir on the command line: install, detect, update and remove emulators, --json on every verb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords = ["emulator", "emulation", "retrogaming", "installer", "cli"]
categories = ["emulators", "command-line-utilities"]

[[bin]]
name = "hermir"
path = "src/main.rs"

[dependencies]
hermir.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }

# `cargo binstall hermir-cli` fetches the release binary instead of building.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/hermir-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
