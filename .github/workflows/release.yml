name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: hermir
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: hermir.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: hermir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - run: cargo build --release -p hermir-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} out/
          cd out && tar czf ../hermir-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
      - uses: softprops/action-gh-release@v2
        with:
          files: hermir-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
