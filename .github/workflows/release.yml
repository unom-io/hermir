name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: hermir
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: hermir.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: hermir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      # SDL 3 for `hermir pads` and `--pad auto`, built from source and linked in: the binary
      # stays self-contained (on Linux it loads libudev at run time, when there is one).
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo build --release -p hermir-cli --features enumerate-static --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} out/
          cd out && tar czf ../hermir-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
      - uses: softprops/action-gh-release@v2
        with:
          files: hermir-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  # crates.io, through trusted publishing: no stored token. Off until the repository variable
  # PUBLISH_CRATES is "true", which is set once both crates exist on crates.io and list this
  # workflow (release.yml) as a trusted publisher. docs/publishing.md has the steps.
  publish:
    if: vars.PUBLISH_CRATES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
