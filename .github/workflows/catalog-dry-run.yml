# Every channel is resolved against its release page, weekly and on catalog changes, so a
# renamed asset becomes a red run here and never a player's failed install.
name: catalog dry run
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths: ["crates/hermir/catalog/**"]
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p hermir-cli
      - name: resolve every Windows channel
        run: ./target/debug/hermir --os windows catalog resolve --all
      - name: resolve every Linux channel
        run: ./target/debug/hermir --os linux catalog resolve --all
