name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p hermir-cli -- catalog validate crates/hermir/catalog
      # Builds each crate from its .crate tarball, as crates.io will: a file the build reads
      # from outside the crate fails here, not at publish.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo package -p hermir -p hermir-cli

  # `enumerate`: SDL 3 built from source and linked in, as the release binaries are. Only this
  # job needs CMake and a C compiler; SDL lists no pads on a runner, and a virtual one it
  # makes itself.
  enumerate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: enumerate
      # SDL loads libudev at run time for hot-plugging when it was built against it.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo clippy -p hermir -p hermir-cli --all-targets --features hermir-cli/enumerate-static -- -D warnings
      - run: cargo test -p hermir -p hermir-cli --features hermir-cli/enumerate-static

  # Licences (permissive only), RustSec advisories, yanked crates, sources: deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
