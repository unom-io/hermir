name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p hermir-cli -- catalog validate crates/hermir/catalog
      # Builds each crate from its .crate tarball, as crates.io will: a file the build reads
      # from outside the crate fails here, not at publish.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo package -p hermir -p hermir-cli
